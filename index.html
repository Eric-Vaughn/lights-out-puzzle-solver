<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lights Out Puzzle Solver</title>
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/app.js" defer></script>
    <script type="module" src="js/grid.js" defer></script>
    <script type="module" src="js/ResetButton.js" defer></script>
    <script type="module" src="js/RandomButton.js" defer></script>
    <script type="module" src="js/SolveButton.js" defer></script>
</head>
<body>
    <h1>Lights Out Puzzle Solver</h1>

    <div class="grid-html">
        <!-- Left column -->
        <div class="column-left">
            <h2>Column container 1</h2>
        </div>
        <!-- Middle column -->
        <div class="column-middle">
            <h2>Lights Out Puzzle Solver</h2>
            <!-- The parent container for the grid -->
            <div id="grid-container" class="grid-container"></div>
            <button id="reset-button" class="reset-button">Reset</button>
            <button id="random-button" class="random-button">Randomize</button>
            <button id="solve-button" class ="solve-button">Solve</button>
        </div>
        <!-- Right column -->
        <div class="column-right">
            <h2>Column container 3</h2>
        </div>
    </div>


</body>
</html>
